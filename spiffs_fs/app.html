      body, html {
  display: flex;

}

.app_header {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 1fr));
  gap: 8pt;
  padding: 10pt;
  background-color: #f7f7f7;
  border-bottom: 1pt solid #ececec;
}

.header_item {
  background-color: #ffffff;
  border: 1pt solid #e7e7e7;
  border-radius: 5pt;
  padding: 8pt 10pt;
}

.header_label {
  font-size: 0.8em;

}

.header_value {
  margin-top: 4pt;
  font-weight: 700;
  color: #4a4a4a;
}

.global_status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8pt;
  padding: 8pt 10pt;

.global_status.error {

.global_status.warning {

      </div>
    </div>
    <div id='global_status' class='global_status hidden'>
      <span id='global_status_message'></span>
      <button id='global_status_retry' type='button'>Retry</button>

    <div id='body'>

    <script>
      const URL = 'http://192.168.1.11'
const DEBUG = false
const REQUEST_RETRIES = 3

const globalStatus = {
  root: null,
  message: null,
  retry: null,
  retryAction: null,
}

function initGlobalStatus() {
  globalStatus.root = document.getElementById('global_status')
  globalStatus.message = document.getElementById('global_status_message')
  globalStatus.retry = document.getElementById('global_status_retry')
  if (!globalStatus.root || !globalStatus.message || !globalStatus.retry) {
    return
  }
  globalStatus.retry.addEventListener('click', () => {
    if (!globalStatus.retryAction) {
      return
    }
    const action = globalStatus.retryAction
    action()
  })
  clearGlobalStatus()
}

function clearGlobalStatus() {
  if (!globalStatus.root || !globalStatus.message || !globalStatus.retry) {
    return
  }
  globalStatus.root.setAttribute('class', 'global_status hidden')
  globalStatus.message.innerText = ''
  globalStatus.retryAction = null
  globalStatus.retry.style.display = 'none'
}

function setGlobalStatus(message, level, retryAction) {
  if (!globalStatus.root || !globalStatus.message || !globalStatus.retry) {
    return
  }
  const statusLevel = level || 'error'
  globalStatus.root.setAttribute('class', `global_status ${statusLevel}`)
  globalStatus.message.innerText = message
  globalStatus.retryAction = retryAction || null
  globalStatus.retry.style.display = globalStatus.retryAction ? 'inline-block' : 'none'
}

function toHttpError(status, responseText, operation) {
  return {
    status: status,
    responseText: responseText,
    operation: operation,
  }
}

function formatHttpError(error) {
  if (!error) {
    return 'unknown error'
  }
  if (error.status) {
    return `HTTP ${error.status}`
  }
  return 'network error'
}

const schedule_promise = (n, retries) => {
  let loading_param_promise = Promise.resolve(),
      promises = []
  return function(req_func, ret_func) {
    let resolve, reject
    const p = new Promise((res, rej) => {resolve = res; reject = rej})
    loading_param_promise.then(async () => {
      let error
      for (let i = 0; i < retries; ++i) {
        try {
          resolve(await req_func())
          return
        } catch(e) {
          error = e
          if (e.status == 404) {
            break
          }
          ret_func && ret_func(e, i + 1)
        }
      }
      reject(error)
    })
    promises.push(p)
    if (promises.length >= n) {
      loading_param_promise = Promise.all(promises).catch((e) => {
        console.log('promise.all', e)
      })
      promises = []
    }

    return p
  }
}
const fetchQueue = schedule_promise(3, REQUEST_RETRIES)

function queueRequest(label, req_func, options) {
  const opts = options || {}
  const silent = opts.silent === true
  return fetchQueue(
    req_func,
    (error, attempt) => {
      if (silent) {
        return
      }
      if (attempt < REQUEST_RETRIES && (!error || error.status !== 404)) {
        setGlobalStatus(`${label}: retry ${attempt}/${REQUEST_RETRIES}...`, 'warning')
      }
    })
    .then((value) => {
      if (!silent) {
        clearGlobalStatus()
      }
      return value
    })
    .catch((error) => {
      if (!silent) {
        const message = `${label} failed (${formatHttpError(error)}).`
        setGlobalStatus(message, 'error', () => {
          queueRequest(label, req_func, options).catch(() => {})
        })
      }
      throw error
    })
}

const fetchConfig = async function() {
  return queueRequest('Loading config', () => new Promise(function(resolve, reject) {
    const r = new XMLHttpRequest()
    r.open('GET', DEBUG ? '/config.json' : '/fs/config.json', true)
    r.onreadystatechange = function () {
      if (r.readyState != 4) return
      if (r.status != 200) {
        reject(toHttpError(r.status, r.responseText, 'fetchConfig'))
        return
      }
      try {
        resolve(JSON.parse(r.responseText))
      } catch (e) {
        reject(toHttpError(r.status, 'invalid json', 'fetchConfig'))
      }
    }
    r.onerror = () => reject(toHttpError(0, 'xhr error', 'fetchConfig'))
    r.send()
  }))
}

const fetchParam = async function(type, paramName, options) {
  return queueRequest(`Loading ${paramName}`, () => new Promise(function(resolve, reject) {
    const r = new XMLHttpRequest()
    r.open('GET', `${DEBUG ? URL : ''}/${type}?k=${paramName}`, true)
    r.onreadystatechange = function () {
      if (r.readyState != 4) return
      if (r.status != 200) {
        reject(toHttpError(r.status, r.responseText, 'fetchParam'))
        return
      }
      if (type == 'i') {
        resolve(parseInt(r.responseText, 10))
      } else {
        resolve(r.responseText)
      }
    }
    r.onerror = () => reject(toHttpError(0, 'xhr error', 'fetchParam'))
    r.send()
  }), options)
}

const updateParam = async function(type, paramName, value, options) {
  return queueRequest(`Updating ${paramName}`, () => new Promise(function(resolve, reject) {
    const r = new XMLHttpRequest()
    r.open('POST', `${DEBUG ? URL : ''}/${type}?k=${paramName}&v=${encodeURIComponent(value)}`, true)
    r.onreadystatechange = function () {
      if (r.readyState != 4) return
      if (r.status != 200) {
        reject(toHttpError(r.status, r.responseText, 'updateParam'))
        return
      }
      resolve(r.responseText)
    }
    r.onerror = () => reject(toHttpError(0, 'xhr error', 'updateParam'))
    r.send()
  }), options)
}

      let config = {}
let arrays = {}
let modules = {}
let headerTimer = null

const WIFI_STATUS_LABELS = {
  1: 'Disconnected',
  2: 'Connecting',
  3: 'Connected',
  4: 'Failed',
  5: 'AP mode',
}
const HEADER_REFRESH_MS = 15000

function moduleTitle(text) {
  const title = document.createElement('h3')
  title.setAttribute('class', 'module_title')
  title.innerText = text
  return title
}

function arrayTitle(text, onShowHide) {
  const body = document.createElement('div')
  body.setAttribute('class', 'array_title')
  const title = document.createElement('h2')
  title.innerText = text
  body.appendChild(title)
  const expand = document.createElement('a')
  expand.innerText = 'show/hide'
  expand.setAttribute('href', 'javascript:void(0)')
  expand.addEventListener('click', onShowHide)
  body.appendChild(expand)
  return body
}

function parseIntegerValue(rawValue) {
  const value = `${rawValue}`.trim()
  if (!/^-?[0-9]+$/.test(value)) {
    return { valid: false, error: 'Integer expected' }
  }
  return { valid: true, value: parseInt(value, 10) }
}

function normalizeFieldValue(field, rawValue) {
  if (field.type == 'integer') {
    return parseIntegerValue(rawValue)
  }
  return { valid: true, value: `${rawValue}` }
}

function findKeyByNameOrCaps(candidates) {
  return config.keys.find((k) => candidates.indexOf(k.name) >= 0 || candidates.indexOf(k.caps_name) >= 0)
}

function setHeaderValue(id, value) {
  const el = document.getElementById(id)
  if (!el) {
    return
  }
  el.innerText = value
}

async function refreshHeaderRuntime() {
  const wifiStatusKey = findKeyByNameOrCaps(['wifi_status', 'WIFI_STATUS'])
  const wifiIpKey = findKeyByNameOrCaps(['wifi_ip', 'WIFI_IP'])
  const buildKey = findKeyByNameOrCaps(['ota_timestamp', 'OTA_TIMESTAMP'])

  if (buildKey) {
    try {
      const build = await fetchParam(buildKey.type.charAt(0), buildKey.caps_name, { silent: true })
      setHeaderValue('header_fw_build', `${build}`)
    } catch (e) {
      setHeaderValue('header_fw_build', '-')
    }
  } else {
    setHeaderValue('header_fw_build', '-')
  }

  if (wifiStatusKey) {
    try {
      const status = await fetchParam(wifiStatusKey.type.charAt(0), wifiStatusKey.caps_name, { silent: true })
      setHeaderValue('header_wifi_status', WIFI_STATUS_LABELS[status] || `Unknown (${status})`)
    } catch (e) {
      setHeaderValue('header_wifi_status', 'Offline')
    }
  } else {
    setHeaderValue('header_wifi_status', '-')
  }

  if (wifiIpKey) {
    try {
      const ip = await fetchParam(wifiIpKey.type.charAt(0), wifiIpKey.caps_name, { silent: true })
      setHeaderValue('header_wifi_ip', ip || '-')
    } catch (e) {
      setHeaderValue('header_wifi_ip', '-')
    }
  } else {
    setHeaderValue('header_wifi_ip', '-')
  }
}

function initHeader() {
  setHeaderValue('header_fw_name', config.name || '-')
  if (headerTimer) {
    clearInterval(headerTimer)
    headerTimer = null
  }
  refreshHeaderRuntime()
  headerTimer = setInterval(refreshHeaderRuntime, HEADER_REFRESH_MS)
}

function renderField(title, field) {
  const body = document.createElement('div')
  const baseClass = field.write ? 'field' : 'field ro'
  const setStatus = (status) => {
    body.setAttribute('class', status ? `${baseClass} ${status}` : baseClass)
  }

  const label = document.createElement('label')
  label.innerText = title
  body.appendChild(label)

  const error = document.createElement('div')
  error.setAttribute('class', 'error')

  let setValue, currentValue
  let saveBtn = null
  let refreshBtn = null
  const setButtonsDisabled = (disabled) => {
    if (saveBtn) {
      saveBtn.disabled = disabled
    }
    if (refreshBtn) {
      refreshBtn.disabled = disabled
    }
  }
  const fetchField = () => {
    setStatus('loading')
    setButtonsDisabled(true)
    fetchParam(field.type.charAt(0), field.caps_name)
    .then(v => {
      currentValue = v
      setValue(v)
      setStatus('')
      error.innerText = ''
    })
    .catch((e) => {
      setStatus('')
      error.innerText = `Failed to load ${field.name}`;
    })
    .finally(() => {
      setButtonsDisabled(false)
    })
  }

  const updateModifiedState = (rawValue) => {
    const normalized = normalizeFieldValue(field, rawValue)
    if (!normalized.valid) {
      setStatus('modified')
      error.innerText = normalized.error
      return false
    }
    error.innerText = ''
    if (`${currentValue}` != `${normalized.value}`) {
      setStatus('modified')
    } else {
      setStatus('')
    }
    return true
  }

  const submitValue = (rawValue) => {
    const normalized = normalizeFieldValue(field, rawValue)
    if (!normalized.valid) {
      setStatus('modified')
      error.innerText = normalized.error
      return
    }
    setStatus('loading')
    setButtonsDisabled(true)
    updateParam(field.type.charAt(0), field.caps_name, normalized.value)
      .then(() => {
        error.innerText = ''
        fetchField()
      })
      .catch(() => {
        setStatus('modified')
        setButtonsDisabled(false)
        error.innerText = `Failed to update ${field.name}`
      })
  }

  if (field.write && !field.indir) {
    const input = document.createElement('input')
    input.setAttribute('class', 'value')
    input.addEventListener('keyup', (e) => {
      if (e.key == 'Enter') {
        submitValue(e.target.value)
      } else {
        updateModifiedState(e.target.value)
      }
    })
    body.appendChild(input)
    const actions = document.createElement('div')
    actions.setAttribute('class', 'field_actions')
    saveBtn = document.createElement('button')
    saveBtn.setAttribute('type', 'button')
    saveBtn.innerText = 'Save'
    saveBtn.addEventListener('click', () => submitValue(input.value))
    refreshBtn = document.createElement('button')
    refreshBtn.setAttribute('type', 'button')
    refreshBtn.innerText = 'Refresh'
    refreshBtn.addEventListener('click', fetchField)
    actions.appendChild(saveBtn)
    actions.appendChild(refreshBtn)
    body.appendChild(actions)
    setValue = (v) => {input.value = v}
  } else if (field.write && field.indir) {
    const input = document.createElement('select')
    input.setAttribute('class', 'value')
    input.addEventListener('change', (e) => {
      updateModifiedState(e.target.value)
    })
    const opt = document.createElement('option')
    opt.value = 0
    opt.innerText = 'Disabled'
    input.appendChild(opt)
    field.indir.values.forEach((i, index) => {
      const opt = document.createElement('option')
      opt.value = i
      opt.innerText = field.indir.helpers[index] || i
      input.appendChild(opt)
    })
    body.appendChild(input)
    const actions = document.createElement('div')
    actions.setAttribute('class', 'field_actions')
    saveBtn = document.createElement('button')
    saveBtn.setAttribute('type', 'button')
    saveBtn.innerText = 'Save'
    saveBtn.addEventListener('click', () => submitValue(input.value))
    refreshBtn = document.createElement('button')
    refreshBtn.setAttribute('type', 'button')
    refreshBtn.innerText = 'Refresh'
    refreshBtn.addEventListener('click', fetchField)
    actions.appendChild(saveBtn)
    actions.appendChild(refreshBtn)
    body.appendChild(actions)
    setValue = (v) => {input.value = v}
  } else {
    const value = document.createElement('div')
    value.setAttribute('class', 'value')
    value.setAttribute('id', field.name)
    body.appendChild(value)
    setValue = (v) => {value.innerText = v}
  }
  body.appendChild(error)
  setStatus('loading')
  fetchField()
  return body
}

function renderModule(title, module, in_array) {
  const body = document.createElement('div')
  body.setAttribute('class', 'module')

  if (title) {
    body.appendChild(moduleTitle(title))
  }

  const fields = document.createElement('div')
  fields.setAttribute('class', 'fields')
  Object.keys(module).sort((m1, m2) => {
    if (module[m1].write && !module[m2].write) {
      return 1
    } else if (module[m2].write && !module[m1].write) {
      return -1
    }
    return m1.localeCompare(m2)
  }).forEach(f => {
    const field = document.createElement('div')
    let name = f
    if (in_array) {
      name = f.split('_').splice(2).join('_')
    } else if (f.indexOf(`${module[f].module}_`) == 0) {
      name = f.replace(new RegExp(`^${module[f].module}_`), '')
    }
    field.appendChild(renderField(name, module[f]))
    fields.appendChild(field)
  })
  body.appendChild(fields)
  return body
}

function renderModules(modules, array) {
  const body = document.createElement('div')
  Object.keys(modules).sort((m1, m2) => {
    if (m1 == array) {
      return -1
    } else if (m2 == array) {
      return 1
    }
    return m1.localeCompare(m2)
  }).forEach(m => {
    body.appendChild(renderModule(m == array ? '' : m, modules[m], !!array))
  })
  return body
}

function renderPagination(n, onSelect) {
  const body = document.createElement('div')
  body.setAttribute('class', 'pagination')

  const links = []
  for (let i = 0; i < n; ++i) {
    const a = document.createElement('a')
    links.push(a)
    const isel = i
    a.innerText = i+1
    a.setAttribute('href', 'javascript:void(0)')
    a.addEventListener('click', () => {
      links.forEach(l => l.setAttribute('class', ''))
      a.setAttribute('class', 'selected')
      onSelect(isel)
    }, false);
    body.appendChild(a)
  }
  links[0].setAttribute('class', 'selected')
  return body
}

function renderArray(title, array) {
  let shown = false;
  const body = document.createElement('div')
  const container = document.createElement('div')
  container.setAttribute('class', 'array_container')

  const render = () => {
    const modules = document.createElement('div')
    modules.appendChild(renderModules(array[0].modules, title))
    container.appendChild(modules)

    container.appendChild(renderPagination(array.length, (i) => {
      while (modules.firstChild) modules.removeChild(modules.firstChild)
      modules.appendChild(renderModules(array[i].modules, title))
    }))
  }

  body.appendChild(arrayTitle(title, () => {
    shown = !shown
    if (shown) {
      render()
    } else {
      while (container.firstChild) container.removeChild(container.firstChild)
    }
  }))
  body.appendChild(container)
  return body
}

function renderParams(data) {
  const body = document.createElement('div')
  body.setAttribute('class', 'params')

  Object.keys(data).sort((d1, d2) => {
    if (data[d1].array) {
      return 1
    } else if (data[d2].array) {
      return -1
    }
    return d1.localeCompare(d2)
  }).forEach(d => {
    if (data[d].array) {
      body.appendChild(renderArray(d, data[d].array))
    } else {
      body.appendChild(renderModules(data[d].modules))
    }
  })
  return body
}

function renderTopMenuItem(id, title, onSelect) {
  const body = document.createElement('div')
  body.setAttribute('class', `menu_item_${id}`)
  body.innerText = title
  body.addEventListener('click', onSelect)
  return body
}

function renderTopMenu(onSelect) {
  const body = document.createElement('div')
  body.setAttribute('class', 'menu modules')
  body.appendChild(renderTopMenuItem('modules', config.name, () => {
    body.setAttribute('class', 'menu modules')
    onSelect('modules')
  }))
  body.appendChild(renderTopMenuItem('system', 'System', () => {
    body.setAttribute('class', 'menu system')
    onSelect('system')
  }))
  return body
}

async function start() {
  config = await fetchConfig()
  modules = config.keys.reduce((acc, k) => {
    const d = acc[k.core ? 'system' : 'modules']
    const n = (k.array ? k.array.name : k.module)
    if (k.array) {
      const i = parseInt(k.name.split('_')[1])
      d[n] = d[n] || {array: []}
      d[n].array[i] = d[n].array[i] || {modules: {}}
      d[n].array[i].modules[k.module] = d[n].array[i].modules[k.module] || {}
      d[n].array[i].modules[k.module][k.name] = k
    } else {
      d[n] = d[n] || {modules: {}}
      d[n].modules[k.module] = d[n].modules[k.module] || {}
      d[n].modules[k.module][k.name] = k
    }
    return acc
  }, {system: {}, modules: {}})

  initHeader()

  const root = document.getElementById('body')
  while (root.firstChild) root.removeChild(root.firstChild)

  const menu = renderTopMenu((s) => {
    while (params.firstChild) params.removeChild(params.firstChild)
    params.appendChild(renderParams(modules[s]))
  })
  root.appendChild(menu)

  const params = document.createElement('div')
  params.appendChild(renderParams(modules.modules))
  root.appendChild(params)
}

window.onload = () => {
  initGlobalStatus()
  start().catch(() => {
    setGlobalStatus('UI startup failed. Please retry.', 'error', () => {
      start().catch(() => {})
    })
  })
}
