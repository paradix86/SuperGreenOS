body, html {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 0; margin: 0;
  font-family: "HelveticaNeue-Light", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif; 
  min-height: 100vh;
  color: #717171;
}

.hidden {
  display: none !important;
}

.app_header {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 1fr));
  gap: 8pt;
  padding: 10pt;
  background-color: #f7f7f7;
  border-bottom: 1pt solid #ececec;
}

.header_item {
  background-color: #ffffff;
  border: 1pt solid #e7e7e7;
  border-radius: 5pt;
  padding: 8pt 10pt;
}

.header_label {
  font-size: 0.8em;
  color: #949494;
}

.header_value {
  margin-top: 4pt;
  font-weight: 700;
  color: #4a4a4a;
}

.global_status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8pt;
  padding: 8pt 10pt;
  border-bottom: 1pt solid #ececec;
}

.global_status.error {
  background-color: #ffecec;
  color: #9a1c1c;
}

.global_status.warning {
  background-color: #fff6e6;
  color: #8a5a00;
}

.global_status > button {
  border: 1pt solid #cfcfcf;
  background-color: #ffffff;
  color: inherit;
  border-radius: 4pt;
  padding: 4pt 8pt;
  cursor: pointer;
}

.app_tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10pt;
  padding: 8pt 10pt;
  border-bottom: 1pt solid #ececec;
  background-color: #fafafa;
}

.connection_badge {
  display: flex;
  align-items: center;
  gap: 10pt;
}

.connection_status {
  display: inline-block;
  font-weight: 700;
  border-radius: 999px;
  padding: 2pt 8pt;
  border: 1pt solid transparent;
}

.connection_status.online {
  color: #0f6b2b;
  background-color: #e7f7ec;
  border-color: #b9e5c5;
}

.connection_status.offline {
  color: #9a1c1c;
  background-color: #ffecec;
  border-color: #f0c0c0;
}

.connection_last_sync {
  color: #777;
}

.tools_actions {
  display: flex;
  gap: 8pt;
}

.tools_actions > button {
  border: 1pt solid #cfcfcf;
  background-color: #ffffff;
  color: #5a5a5a;
  border-radius: 4pt;
  padding: 4pt 8pt;
  cursor: pointer;
}

@media only screen and (max-width: 800px) {
  .app_tools {
    flex-direction: column;
    align-items: stretch;
  }
  .connection_badge {
    justify-content: space-between;
  }
  .tools_actions {
    justify-content: flex-start;
  }
}

@media only screen and (max-width: 800px) {
  .app_header {
    grid-template-columns: repeat(2, minmax(120px, 1fr));
  }
}

.menu {
  display: flex;
}

.modules > .menu_item_modules, .system > .menu_item_system {
  border-bottom: 2pt solid #454545;
}

.menu_item_modules, .menu_item_system {
  cursor: pointer;
  padding: 10pt 10pt;
}

.params {
  display: flex;
  flex-direction: column;
}

.section_title {
  margin: 20pt 10pt;
}

@media only screen and (max-width: 800px) {
  .section_title {
    text-align: center;
    font-size: 1.2em;
  }
}

.fields {
  display: flex;
  flex-wrap: wrap;
}

.fields > div {
  flex-basis: 25%;
}

@media only screen and (max-width: 800px) {
  .fields > div {
    flex-basis: 100%;
  }
}

.field {
  display: flex;
  flex-direction: column;
  padding: 10pt 20pt;
}

.ro {
  flex-direction: row;
}

.ro > .value {
  flex: 1;
  display: flex;
  justify-content: center;
  font-weight: 800;
}

@media only screen and (max-width: 800px) {
  .field {
    padding: 10pt 0pt;
  }
}

.field > label {
  display: block;
  font-weight: 800;
  margin-bottom: 10pt;
}

.field_actions {
  display: flex;
  gap: 8pt;
  margin-top: 8pt;
}

.field_actions > button {
  border: 1pt solid #cfcfcf;
  background-color: #ffffff;
  color: #5a5a5a;
  border-radius: 4pt;
  padding: 4pt 8pt;
  cursor: pointer;
}

.field_actions > button:disabled {
  opacity: 0.6;
  cursor: default;
}

.loading > .value {
  opacity: 0.5;
}

.error {
  color: red;
}

.modified > label::after {
  content: '*'
}

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10pt 0;
}

.pagination > a {
  font-weight: 800;
  margin: 0 5pt;
  color: #717171;
}

.selected {
  font-size: 1.3em;
  text-decoration: none;
  color: black !important;
}

.module_title {
  font-size: 1.1em;
  padding-bottom: 5pt;
  border-bottom: 1pt solid #ececec;
}

@media only screen and (max-width: 800px) {
  .module_title {
    font-size: 1em;
  }
}

.module {
  padding: 10pt 10pt;
  background-color: #f5f5f5;
  margin: 5pt;
  border-radius: 5pt;
}

.array_title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10pt 10pt;
  text-transform: uppercase;
  border-bottom: 1pt solid #ececec;
  color: #717171;
}

.array_title > h2 {
  font-size: 1.1em;
}

@media only screen and (max-width: 800px) {
  .array_title > h2 {
    font-size: 1em;
  }
  .array_title > a {
    font-size: 0.7em;
  }
}

.array_title > a {
  margin: 0 10pt;
  color: #717171;
}

.array_container {
  margin: 20pt 20pt;
}

@media only screen and (max-width: 800px) {
  .array_container {
    margin: 10pt 10pt;
  }
}
.dash {
  padding: 10pt;
  background-color: #f7f7f7;
}

.dash_toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10pt;
  margin-bottom: 8pt;
  font-size: 0.9em;
}

.dash_toolbar > button, .dash_form > button {
  border: 1pt solid #cfcfcf;
  background-color: #ffffff;
  color: #5a5a5a;
  border-radius: 4pt;
  padding: 4pt 8pt;
  cursor: pointer;
}

.dash_grid {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr);
  gap: 8pt;
  align-items: start;
}

.dash_boxes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8pt;
}

.dash_leds {
  margin-top: 8pt;
}

/* grid/flex children default to min-width:auto and would push the cards
   wider than a phone screen instead of wrapping */
.dash_grid > *, .dash_boxes > *, .dash_row > *, .dash_bar > * {
  min-width: 0;
}

.dash_card {
  background-color: #ffffff;
  border: 1pt solid #e4e4e4;
  border-radius: 6pt;
  padding: 10pt;
  overflow: hidden;
}

.dash_card.disabled {
  opacity: 0.6;
}

.dash_card_title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6pt;
  margin-bottom: 8pt;
}

.dash_card_title > h3 {
  margin: 0;
  font-size: 1.05em;
  color: #4a4a4a;
}

.dash_chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4pt;
}

.chip {
  display: inline-block;
  border-radius: 999px;
  padding: 2pt 8pt;
  font-size: 0.8em;
  font-weight: 700;
  color: #666;
  background-color: #efefef;
  white-space: nowrap;
}

.chip.ok { color: #0f6b2b; background-color: #e7f7ec; }
.chip.warn { color: #8a5a00; background-color: #fff6e6; }
.chip.bad { color: #9a1c1c; background-color: #ffecec; }
.chip.day { color: #7a5200; background-color: #fff3c4; }
.chip.night { color: #ffffff; background-color: #3b4a6b; }

.dash_row {
  display: flex;
  justify-content: space-between;
  gap: 8pt;
  padding: 3pt 0;
  border-bottom: 1pt solid #f2f2f2;
  font-size: 0.9em;
}

.dash_row > strong {
  color: #4a4a4a;
  text-align: right;
  overflow-wrap: anywhere;
}

.dash_readings {
  display: flex;
  flex-wrap: wrap;
  gap: 6pt 14pt;
  margin: 4pt 0 8pt 0;
}

.dash_readings > div > b {
  font-size: 1.8em;
  color: #333;
}

.dash_readings > div > span {
  margin-left: 3pt;
  font-size: 0.8em;
  color: #888;
}

.dash_sparks {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6pt;
  margin-bottom: 8pt;
}

.dash_sparks > div > span {
  display: block;
  font-size: 0.75em;
  color: #888;
}

.spark {
  display: block;
  width: 100%;
  height: 28px;
  fill: none;
  stroke: #3d8f4e;
  stroke-width: 1.5;
}

.spark polyline {
  vector-effect: non-scaling-stroke;
}

.spark_range {
  font-size: 0.7em;
  color: #999;
}

.dash_bar {
  display: grid;
  grid-template-columns: 52px 1fr 44px;
  align-items: center;
  gap: 6pt;
  padding: 2pt 0;
  font-size: 0.9em;
}

.dash_bar > i {
  display: block;
  height: 8px;
  border-radius: 4px;
  background-color: #eeeeee;
  overflow: hidden;
}

.dash_bar > i > b {
  display: block;
  height: 100%;
  background-color: #6cbf7a;
}

.dash_bar > strong {
  text-align: right;
  color: #4a4a4a;
}

.dash_table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9em;
}

.dash_table th, .dash_table td {
  text-align: left;
  padding: 4pt 4pt;
  border-bottom: 1pt solid #f0f0f0;
}

.dash_form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6pt 10pt;
  margin-top: 10pt;
  padding-top: 8pt;
  border-top: 1pt solid #ececec;
  font-size: 0.85em;
}

.dash_form_title, .dash_form > button {
  grid-column: 1 / -1;
}

.dash_form_title {
  font-weight: 700;
  color: #565656;
}

.dash_form > label {
  display: flex;
  flex-direction: column;
  color: #666;
}

.dash_form > label.inline {
  flex-direction: row;
  align-items: center;
  gap: 6pt;
}

.dash_form input[type=number] {
  width: 100%;
  box-sizing: border-box;
}

.dash_alerts {
  display: flex;
  flex-wrap: wrap;
  gap: 4pt;
  margin-bottom: 8pt;
}

.dash_alerts > .chip {
  white-space: normal;
}

.dash_ref {
  margin: 0 0 4pt 0;
  font-size: 0.85em;
  color: #8a8a8a;
}

.dash_ref > i {
  display: block;
  position: relative;
  height: 6px;
  margin-top: 2pt;
  border-radius: 3px;
  background: linear-gradient(90deg, #cfe8d4, #f2d9a6);
}

.dash_ref > i > b {
  position: absolute;
  top: -3px;
  width: 4px;
  height: 12px;
  margin-left: -2px;
  border-radius: 2px;
  background-color: #454545;
}

.dash_note {
  margin: 4pt 0;
  padding: 4pt 6pt;
  border-radius: 4pt;
  font-size: 0.85em;
}

.dash_note.warn { color: #8a5a00; background-color: #fff6e6; }
.dash_small { font-size: 0.85em; overflow-wrap: anywhere; }
.dash_muted { color: #8a8a8a; }

.dashboard > .menu_item_dashboard {
  border-bottom: 2pt solid #454545;
}

.menu_item_dashboard {
  cursor: pointer;
  padding: 10pt 10pt;
}

@media only screen and (max-width: 800px) {
  .dash_grid { grid-template-columns: 1fr; }
}
